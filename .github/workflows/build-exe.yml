name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Verify bundled phone APKs
        run: python tools/prepare_phone_bundle.py --check

      - name: Test phone provisioning
        run: python -m unittest -v test_phone_setup test_phone_autostart

      - name: Build EXE
        run: pyinstaller V6.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: galaxy-reset-v8
          path: dist/갤럭시 초기화 V8.exe
