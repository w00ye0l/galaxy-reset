name: Publish App Update

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'App tag (leave blank to use app-v plus the bundled APK version)'
        required: false
        type: string
      build_windows:
        description: 'Also rebuild and publish Windows EXE (app tags publish APK only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-app-update
  cancel-in-progress: false

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    uses: ./.github/workflows/build-exe.yml
  publish:
    needs: windows
    if: always() && !cancelled() && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        if: needs.windows.result == 'success'
        with:
          name: galaxy-reset-v8
          path: release-exe
      - name: Prepare signed APK and update metadata
        id: prepare
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          args=(--tag "$RELEASE_TAG" --output release-app --github-output "$GITHUB_OUTPUT")
          if [ -f 'release-exe/갤럭시 초기화 V8.exe' ]; then
            args+=(--exe 'release-exe/갤럭시 초기화 V8.exe')
          fi
          python tools/prepare_app_release.py "${args[@]}"
      - name: Verify release tag points to this commit
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
      - name: Publish exact signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.title }}
        run: |
          files=(release-app/galaxy-reset.apk release-app/galaxy-reset-update.json)
          if [ -f 'release-exe/갤럭시 초기화 V8.exe' ]; then
            files+=(release-app/galaxy-reset-windows-*)
          fi
          gh release create "$RELEASE_TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-app/release-notes.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
