plugins { id 'com.android.application' }

android {
    namespace 'com.forholiday.language'
    compileSdk 36
    defaultConfig {
        applicationId 'com.forholiday.language'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    bundle {
        language { enableSplit = false }
    }
}
