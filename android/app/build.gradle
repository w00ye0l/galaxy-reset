plugins { id 'com.android.application' }
def nmapBundle = new groovy.json.JsonSlurper().parse(rootProject.file('../nmap-bundle.json'))
android {
    namespace 'com.forholiday.galaxyreset'
    compileSdk 36
    defaultConfig {
        applicationId 'com.forholiday.galaxyreset'
        minSdk 30
        targetSdk 36
        versionCode 24
        versionName '1.1.20'
        testInstrumentationRunner 'com.forholiday.galaxyreset.ProgressLayoutCheck'
        buildConfigField 'long', 'NMAP_VERSION_CODE', nmapBundle.versionCode.toString() + 'L'
        buildConfigField 'String[]', 'NMAP_APKS', 'new String[]{' + nmapBundle.apks.collect { '"' + it.file + '"' }.join(',') + '}'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/resetAssets')
}
def resetAssets = ['locale_changer.dex', 'account_remover.dex', 'account_preparer.dex', 'esim_manager.dex',
                   'content_cleaner.dex', 'wallpaper_setter.dex', 'recent_tasks_cleaner.dex',
                   'S23.png', 'S24.png', 'S25.png', 'S26.png', 'filemanager.apk', 'nmap-bundle.json'] + nmapBundle.apks.collect { it.file }
tasks.register('prepareResetAssets', Copy) {
    from rootProject.file('..')
    include resetAssets
    into layout.buildDirectory.dir('generated/resetAssets')
    doFirst {
        resetAssets.each { name ->
            def asset = rootProject.file('../' + name)
            if (!asset.isFile()) throw new GradleException('Missing asset: ' + name)
            if (name.endsWith('.apk')) {
                asset.withInputStream { input ->
                    if (input.read() != 0x50 || input.read() != 0x4b) throw new GradleException('Invalid APK / Git LFS pointer: ' + name + '. Run git lfs pull.')
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareResetAssets' }
dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
