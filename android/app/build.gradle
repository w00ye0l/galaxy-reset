plugins { id 'com.android.application' }
evaluationDependsOn(':language-picker')
def languageProject = project(':language-picker')
def languageApk = languageProject.layout.buildDirectory.file('outputs/apk/debug/language-picker-debug.apk')
def homeApps = [
    [package: 'com.forholiday.language', file: 'language.apk', versionCode: languageProject.android.defaultConfig.versionCode],
    [package: 'com.locarora.app', file: 'locarora.apk', versionCode: 12]
]
def nmapBundle = new groovy.json.JsonSlurper().parse(rootProject.file('../nmap-bundle.json'))
def filemanagerBundle = new groovy.json.JsonSlurper().parse(rootProject.file('../filemanager-bundle.json'))
android {
    namespace 'com.forholiday.galaxyreset'
    compileSdk 36
    defaultConfig {
        applicationId 'com.forholiday.galaxyreset'
        minSdk 30
        targetSdk 36
        versionCode 30
        versionName '1.1.26'
        testInstrumentationRunner 'com.forholiday.galaxyreset.ProgressLayoutCheck'
        buildConfigField 'long', 'FILEMANAGER_VERSION_CODE', filemanagerBundle.versionCode.toString() + 'L'
        buildConfigField 'long', 'LANGUAGE_VERSION_CODE', homeApps[0].versionCode.toString() + 'L'
        buildConfigField 'long', 'LOCARORA_VERSION_CODE', homeApps[1].versionCode.toString() + 'L'
        buildConfigField 'long', 'NMAP_VERSION_CODE', nmapBundle.versionCode.toString() + 'L'
        buildConfigField 'String[]', 'NMAP_APKS', 'new String[]{' + nmapBundle.apks.collect { '"' + it.file + '"' }.join(',') + '}'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/resetAssets')
}
def resetAssets = ['locale_changer.dex', 'account_remover.dex', 'account_preparer.dex', 'esim_manager.dex',
                   'content_cleaner.dex', 'wallpaper_setter.dex', 'recent_tasks_cleaner.dex',
                   'S23.png', 'S24.png', 'S25.png', 'S26.png', 'filemanager.apk', 'locarora.apk', 'nmap-bundle.json'] + nmapBundle.apks.collect { it.file }
tasks.register('prepareResetAssets', Copy) {
    dependsOn ':language-picker:assembleDebug'
    inputs.property('homeApps', groovy.json.JsonOutput.toJson(homeApps))
    from(languageApk) { rename { 'language.apk' } }
    from(rootProject.file('..')) { include resetAssets }
    into layout.buildDirectory.dir('generated/resetAssets')
    doFirst {
        resetAssets.each { name ->
            def asset = rootProject.file('../' + name)
            if (!asset.isFile()) throw new GradleException('Missing asset: ' + name)
            if (name.endsWith('.apk')) {
                asset.withInputStream { input ->
                    if (input.read() != 0x50 || input.read() != 0x4b) throw new GradleException('Invalid APK / Git LFS pointer: ' + name + '. Run git lfs pull.')
                }
            }
        }
    }
    doLast {
        new File(destinationDir, 'home-apps.json').setText(groovy.json.JsonOutput.toJson(homeApps), 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareResetAssets' }
dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
